# =============================================================================
# dvc.yaml — last_year/
# FIAP AI - 2 Ano Letivo (2026) - Projeto Cardio-Edge-AI
#
# Pipeline declarativo DVC. Este arquivo fica no root de last_year/ porque
# o `dvc init` deve ser executado aqui — onde ja estao .gitignore e .dvcignore.
# O `wdir` de cada stage aponta para challenge/ai_cardiology/, mantendo
# os caminhos internos relativos e legiveis.
#
# INICIALIZACAO (rodar uma unica vez):
#   cd last_year/
#   dvc init
#   dvc remote add -d local_storage "C:\dvc-remotes\cardio-edge-ai"
#   dvc remote default local_storage
#
# REPRODUCAO:
#   dvc repro                        <- executa apenas stages desatualizados
#   dvc repro --force                <- forca re-execucao completa
#   dvc repro signal_vision          <- stage especifico e suas dependencias
#   dvc dag                          <- visualiza o grafo de dependencias
#
# PRE-REQUISITO ANTES DO PRIMEIRO repro:
#   dvc pull                         <- restaura dados brutos do remote DVC local
#
# ORDEM DE EXECUCAO (inferida automaticamente pelo DVC via DAG):
#   ptbxl_eda -> iot_simulation
#             -> signal_vision
#   nlp_pruning -> nlp_engineering -> symptom_extraction -> risk_classification
#
# NOTA SOBRE cmd:
#   `jupyter nbconvert --to notebook --execute --inplace` executa o notebook
#   e salva o resultado com outputs no proprio .ipynb, preservando o
#   storytelling visual (graficos, tabelas) para avaliacao da FIAP.
# =============================================================================

stages:

  # ---------------------------------------------------------------------------
  # STAGE 1 - EDA e Arquitetura Dual PTB-XL
  # ---------------------------------------------------------------------------
  # Ponto de entrada de todo o pipeline. Ingere o PTB-XL bruto e produz as
  # duas matrizes centrais do projeto:
  #   - ptbxl_engineered_features.csv: 6.665 Gemeos Digitais x 20 features
  #     (IMC, BSA Mosteller, LBM, TMB, Desvio de Coorte, flag HIPAA, vetor
  #     alvo Multi-Label com 6 superclasses)
  #   - ptbxl_gateway_fallback.csv: 15.051 exames sem biometria completa
  #
  # Prova estatistica incluida: Pearson r=-0,099 (p=4,87e-16) entre IMC e
  # voltagem ECG, validando a necessidade da arquitetura multimodal.
  # ---------------------------------------------------------------------------
  ptbxl_eda:
    wdir: challenge/ai_cardiology
    cmd: jupyter nbconvert --to notebook --execute --inplace notebooks/ptblxl_eda.ipynb
    deps:
      - notebooks/ptblxl_eda.ipynb
      - data/raw/ptbxl/ptbxl_database.csv     # 21.799 registros, 28 colunas
      - data/raw/ptbxl/scp_statements.csv     # dicionario dos 71 codigos SCP-ECG
    outs:
      - data/processed/ptbxl/features/ptbxl_engineered_features.csv:
          cache: false   # [GIT OK] ~2MB - versionado diretamente no Git
      - data/processed/ptbxl/features/ptbxl_gateway_fallback.csv:
          cache: false   # [GIT OK] ~1MB - versionado diretamente no Git

  # ---------------------------------------------------------------------------
  # STAGE 2 - Calibracao Arquitetural IoT (Simulacao Wearable 24h)
  # ---------------------------------------------------------------------------
  # Notebook de calibracao, nao de producao de dado clinico. Modela as tres
  # camadas do ecossistema fisico com 86.400 epocas (24h):
  #   - XIAO nRF52840 Sense + ADS1293 (aquisicao ECG 24-bit, 3 canais)
  #   - Raspberry Pi 5 + Google Coral USB (inferencia TFLite, 0,333ms)
  #   - Motor estocastico: curva termodinamica LiPo 750mAh, artefatos clinicos
  #     (Baseline Wander, EMG Valsalva, Aliasing 60Hz->40Hz), evento IAM
  #
  # Depende do stage anterior para usar distribuicoes demograficas reais do
  # PTB-XL como parametros do Gemeo Digital comportamental.
  # ---------------------------------------------------------------------------
  iot_simulation:
    wdir: challenge/ai_cardiology
    cmd: jupyter nbconvert --to notebook --execute --inplace notebooks/holter_iot_data_simulation.ipynb
    deps:
      - notebooks/holter_iot_data_simulation.ipynb
      - data/processed/ptbxl/features/ptbxl_engineered_features.csv
    outs:
      - data/processed/simulations/holter_iot_data_simulation.csv:
          cache: false   # [DVC-no-cache] 468MB - dado sintetico, reproduzivel via dvc repro
                         # bloqueado no .gitignore; nao vai ao Git nem ao cache DVC

  # ---------------------------------------------------------------------------
  # STAGE 3 - Processamento Multimodal de Sinais e Visao Computacional
  # ---------------------------------------------------------------------------
  # Consome os sinais WFDB brutos dos 6.665 Gemeos Digitais. Pipeline DSP:
  #   Butterworth HP 0,5Hz ord.3 + Notch 50Hz Q=30, filtfilt zero-phase
  #   -> remocao de 29,6% da energia de ruido
  #   -> STFT (Hann, nperseg=64, noverlap=56, nfft=256)
  #   -> espectrogramas (129,118) redimensionados para 224x224px
  #   -> normalizacao Min-Max [0,1]
  #   -> particionamento strat_fold: treino 5.314 / val 683 / teste 668
  #
  # Saida mais pesada do pipeline: ~1,3GB de tensores .npy + PNGs de auditoria.
  # Requer `dvc pull` dos dados brutos antes da primeira execucao.
  # ---------------------------------------------------------------------------
  signal_vision:
    wdir: challenge/ai_cardiology
    cmd: jupyter nbconvert --to notebook --execute --inplace notebooks/ptbxl_signal_vision_eda.ipynb
    deps:
      - notebooks/ptbxl_signal_vision_eda.ipynb
      - data/raw/ptbxl/records100/             # sinais WFDB 100Hz - requer dvc pull
      - data/processed/ptbxl/features/ptbxl_engineered_features.csv
    outs:
      - data/processed/ptbxl/tensors/          # [DVC] 9 arrays .npy ~1,3GB
      - data/processed/ptbxl/images/ecg_12_lead_grids/  # [DVC] 100 PNGs clinicos
      - data/processed/ptbxl/images/spectrograms/       # [DVC] 100 PNGs espectrogramas

  # ---------------------------------------------------------------------------
  # STAGE 4 - Poda e Curadoria do Corpus NLP
  # ---------------------------------------------------------------------------
  # OrquestradorPodaPDF com Pruning Maps por dominio sobre 27 PDFs brutos:
  #   - Diretrizes SBC/SUS: reducao 76%-89% do ruido
  #   - Relatos clinicos: preservacao de anamnese e achados
  #   - Bulas ANVISA: retencao exclusiva de indicacoes, contraindicacoes,
  #     posologia
  # Taxa media de reducao dimensional: ~55%
  #
  # Saidas com politicas de rastreamento distintas:
  #   pruned_pdfs/ -> [DVC] binarios cache no remote local
  #   parsed_txt/  -> [GIT OK] texto puro, diff legivel, <1MB cada
  # ---------------------------------------------------------------------------
  nlp_pruning:
    wdir: challenge/ai_cardiology
    cmd: jupyter nbconvert --to notebook --execute --inplace notebooks/nlp_data_pruning.ipynb
    deps:
      - notebooks/nlp_data_pruning.ipynb
      - data/raw/nlp/                          # PDFs brutos - requer dvc pull
    outs:
      - data/processed/nlp/pruned_pdfs/        # [DVC] 26 PDFs podados ~20MB
      - data/processed/nlp/parsed_txt/:
          cache: false                         # [GIT OK] 26 .txt legiveis no Git

  # ---------------------------------------------------------------------------
  # STAGE 5 - Engenharia Semantica e Lookup de Gatilho Assincrono
  # ---------------------------------------------------------------------------
  # Pipeline ETL completo sobre os 26 PDFs podados:
  #   - Sanitizacao lexical em 3 passagens: 479 tokens proibidos
  #   - Fuzzy Matching Levenshtein (threshold 0,85): 35 correcoes de OCR
  #   - Stemming RSLP: -35,5% do Feature Space (-3.463 dimensoes redundantes)
  #   - Vetorizacao TF-IDF: 6.276 dimensoes de alto valor diagnostico
  #
  # Entregavel: edge_trigger_lookup.json (6,41KB)
  # Lookup Table com Top-10 tensores clinicos por documento para inferencia
  # semantica assincrona em O(1) no Raspberry Pi 5 sem NLP em tempo real.
  # ---------------------------------------------------------------------------
  nlp_engineering:
    wdir: challenge/ai_cardiology
    cmd: jupyter nbconvert --to notebook --execute --inplace notebooks/nlp_data_engineer.ipynb
    deps:
      - notebooks/nlp_data_engineer.ipynb
      - data/processed/nlp/parsed_txt/
      - data/processed/nlp/pruned_pdfs/
    outs:
      - data/processed/nlp/cleaned/edge_trigger_lookup.json:
          cache: false                         # [GIT OK] 6,41KB - versionado no Git

  # ---------------------------------------------------------------------------
  # STAGE 6 - Extracao de Sintomas PT-BR (NB6)
  # ---------------------------------------------------------------------------
  # Consome o edge_trigger_lookup.json do NB5 e os textos podados para extrair
  # sintomas cardiologicos via matching baseado em regras ACC/AHA ampliadas.
  # Produz D1 (10 chiefcomplaints), D2 (mapa sintoma-doenca 929 linhas) e o
  # corpus_frases_completo.csv base do classificador NB7.
  # ---------------------------------------------------------------------------
  symptom_extraction:
    wdir: challenge/ai_cardiology
    cmd: jupyter nbconvert --to notebook --execute --inplace notebooks/symptom_extraction.ipynb
    deps:
      - notebooks/symptom_extraction.ipynb
      - src/enrich_nb6.py
      - data/processed/nlp/cleaned/edge_trigger_lookup.json
      - data/processed/nlp/parsed_txt/
    outs:
      - data/processed/nlp/symptom_extraction/:
          cache: false                         # [GIT OK] CSVs e TXTs legiveis

  # ---------------------------------------------------------------------------
  # STAGE 7 - Classificador de Risco PT-BR v1 (NB7)
  # ---------------------------------------------------------------------------
  # TF-IDF + Logistic Regression sobre o corpus PT-BR. Resultado F1=1.000
  # diagnosticado como leakage de dominio (Jaccard vocabulario=0.021).
  # Stage mantido para reproduzir o historico do problema e sua correcao.
  # ---------------------------------------------------------------------------
  risk_classification:
    wdir: challenge/ai_cardiology
    cmd: jupyter nbconvert --to notebook --execute --inplace notebooks/risk_classifier.ipynb
    deps:
      - notebooks/risk_classifier.ipynb
      - data/processed/nlp/symptom_extraction/corpus_frases_completo.csv
    outs:
      - data/processed/nlp/risk_classification/:
          cache: false                         # [GIT OK] pkl 9.8KB, CSVs, charts

  # ---------------------------------------------------------------------------
  # STAGE 8 - EDA Corpus MIMIC-IV-ECG (NB9)
  # ---------------------------------------------------------------------------
  # Diagnostico formal do leakage e EDA do corpus MIMIC-IV-ECG: 800.035 ECGs,
  # laudos automatizados GE MUSE. Selecao de 1.193 frases com 47 padroes
  # ACC/AHA. Jaccard pos-pivote=0.224 - modelo aprende conteudo clinico real.
  #
  # PRE-REQUISITO: acesso MIMIC-IV-ECG via PhysioNet (credencial CITI).
  # Dados restritos em data/raw/mimic-iv-ecg/ - nao reproduzivel sem acesso.
  # ---------------------------------------------------------------------------
  nlp_mimic_eda:
    wdir: challenge/ai_cardiology
    cmd: jupyter nbconvert --to notebook --execute --inplace notebooks/nlp_mimic_iv/NB9_eda_nlp_mimic_iv.ipynb
    deps:
      - notebooks/nlp_mimic_iv/NB9_eda_nlp_mimic_iv.ipynb
    outs:
      - data/processed/nlp/mimic_corpus/:
          cache: false
      - data/processed/nlp/mimic_eda_charts/:
          cache: false

  # ---------------------------------------------------------------------------
  # STAGE 9 - Extracao de Sintomas MIMIC v2 (NB10)
  # ---------------------------------------------------------------------------
  # D1 com 10 chiefcomplaints reais do MIMIC-IV-ED, D2 com 35 regras ACC/AHA.
  # PRE-REQUISITO: MIMIC-IV-ED 2.2 em data/raw/mimic-iv-ed-2.2/ (restrito).
  # ---------------------------------------------------------------------------
  nlp_mimic_symptoms:
    wdir: challenge/ai_cardiology
    cmd: jupyter nbconvert --to notebook --execute --inplace notebooks/nlp_mimic_iv/NB10_symptom_extraction.ipynb
    deps:
      - notebooks/nlp_mimic_iv/NB10_symptom_extraction.ipynb
      - data/processed/nlp/mimic_corpus/corpus_mimic_ecg_rotulado_v2.csv
    outs:
      - data/processed/nlp/symptom_extraction/:
          cache: false

  # ---------------------------------------------------------------------------
  # STAGE 10 - Classificador de Risco MIMIC v2 (NB11)
  # ---------------------------------------------------------------------------
  # Pipeline sklearn oficial: TfidfVectorizer(ngram_range=(1,2), max_features=
  # 1000) + LogisticRegression(C=1.0, class_weight=balanced).
  # acc=0.96, F1 macro=0.970, ROC-AUC=1.0, FN=0, pkl 9.8KB.
  # ---------------------------------------------------------------------------
  nlp_mimic_risk:
    wdir: challenge/ai_cardiology
    cmd: jupyter nbconvert --to notebook --execute --inplace notebooks/nlp_mimic_iv/NB11_risk_classifier.ipynb
    deps:
      - notebooks/nlp_mimic_iv/NB11_risk_classifier.ipynb
      - data/processed/nlp/mimic_corpus/corpus_mimic_ecg_rotulado_v2.csv
    outs:
      - data/processed/nlp/risk_classification/:
          cache: false

  # ---------------------------------------------------------------------------
  # STAGE 11 - MLP ECG MIT-BIH (NB8)
  # ---------------------------------------------------------------------------
  # MLP Input(187)->Dense(256,128,64)->Softmax5 sobre o heartbeat MIT-BIH.
  # Split estratificado (v2): val_accuracy 0.018->0.761 na epoca 1.
  # Saidas: modelo keras best val_accuracy, TFLite INT8 102.5KB, charts.
  #
  # PRE-REQUISITO: dvc pull challenge/ai_cardiology/data/raw/heartbeat.dvc
  # ---------------------------------------------------------------------------
  mlp_ecg:
    wdir: challenge/ai_cardiology
    cmd: jupyter nbconvert --to notebook --execute --inplace notebooks/mlp_ecg_heartbeat.ipynb
    deps:
      - notebooks/mlp_ecg_heartbeat.ipynb
      - data/raw/heartbeat/                    # requer: dvc pull heartbeat.dvc
    outs:
      - models/nb8_mlp_ecg_best.keras:
          cache: false                         # [GIT OK] ~350KB - entregavel
      - models/nb8_mlp_ecg_int8.tflite:
          cache: false                         # [GIT OK] 102.5KB - entregavel
      - data/processed/fase2/:
          cache: false                         # [GIT OK] charts, experiment_log
